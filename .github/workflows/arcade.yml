name: Play arcade games on the contribution graph

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Generate arcade SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,galaga"

      - name: Commit SVGs
        run: |
          mkdir -p assets/arcade
          mv dist/*.svg assets/arcade/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arcade
          git diff --staged --quiet || (git commit -m "chore: refresh arcade contribution graphs" && git push)
